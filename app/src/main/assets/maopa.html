<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; background: #121111; }
    </style>
</head>
<body>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Coordenadas da Times Square (Nova York, EUA)
    var latDestino = 40.7580;
    var lngDestino = -73.9855;

    var map = L.map('map').setView([latDestino, lngDestino], 15);

    // Camada de mapa OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Marcador do Destino (Times Square)
    var marcadorDestino = L.marker([latDestino, lngDestino]).addTo(map)
        .bindPopup('<b>Times Square - Evento</b>')
        .openPopup();

    var marcadorUsuario = null;

    // Função chamada pelo Android para atualizar a localização do usuário
    function updateLocation(lat, lng) {
        try {
            var origem = [lat, lng];
            if (marcadorUsuario) {
                map.removeLayer(marcadorUsuario);
            }
            marcadorUsuario = L.marker(origem).addTo(map)
                .bindPopup('<b>Você está aqui</b>');
            map.setView(origem, 16);
        } catch (e) {
            console.error("Erro ao atualizar localização: " + e.message);
        }
    }
</script>
</body>
</html>
